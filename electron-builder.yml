appId: com.gamekins.launcher
productName: Gamekins
copyright: Copyright © 2026 Gamekins
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - resources/**
  - package.json
asarUnpack:
  - resources/**
protocols:
  - name: Gamekins
    schemes: [gamekins]
# Publishing is a separate, manual action after artifact review.
publish: null
win:
  icon: build/icon.png
  target: [nsis]
  forceCodeSigning: true
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  artifactName: ${productName}-${version}-windows-${arch}-setup.${ext}
# Partner Center identity is supplied by scripts/release-config.cjs.
appx:
  displayName: Gamekins
  applicationId: Gamekins
  backgroundColor: '#171a21'
  languages: [en-US]
  artifactName: ${productName}-${version}-windows-${arch}-store.${ext}
mac:
  icon: build/icon.png
  category: public.app-category.games
  target:
    - target: dmg
      arch: [universal]
  forceCodeSigning: true
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
dmg:
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
linux:
  icon: build/icon.png
  executableName: gamekins
  category: Game
  synopsis: A launcher for your PC game libraries
  maintainer: ErzenXz <ErzenXz@users.noreply.github.com>
  target: [AppImage, deb]
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
